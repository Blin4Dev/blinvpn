<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlinVPN</title>
    <!-- Официальный SDK Telegram Mini Apps: initData, expand(), requestFullscreen() -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #14110E; }
      #blin-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #14110E; font-family: 'Outfit', system-ui, sans-serif;
      }
      #blin-boot .sp {
        width: 52px; height: 52px; border-radius: 50%;
        border: 4px solid rgba(255,107,26,0.18); border-top-color: #FF6B1A;
        animation: blinboot 0.85s linear infinite;
      }
      #blin-boot .tx { color: #FFF8F0; font-size: 15px; font-weight: 600; opacity: .85; }
      @keyframes blinboot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="blin-boot"><div class="sp"></div><div class="tx">Загрузка…</div></div>
    <!-- Vite root теперь src/app, поэтому путь локальный -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
