<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlinVPN</title>
    <!-- Официальный SDK Telegram Mini Apps: initData, expand(), requestFullscreen() -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #14110E; }
      #blin-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #14110E;
        /* как pageFrame: логотип в масштабе макета 402, иначе скачок в React */
        padding: 0;
        box-sizing: border-box;
      }
      #blin-boot img {
        width: calc(min(200px, 42vh) * var(--blin-scale, 1));
        height: calc(min(200px, 42vh) * var(--blin-scale, 1));
        max-width: calc(200px * var(--blin-scale, 1));
        max-height: calc(200px * var(--blin-scale, 1));
        object-fit: contain;
      }
    </style>
    <script>
      (function () {
        var w = window.innerWidth || 402;
        document.documentElement.style.setProperty("--blin-scale", String(Math.min(1, w / 402)));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="blin-boot"><img src="/assets/logo.png" alt="" width="200" height="200" /></div>
    <!-- Vite root теперь src/app, поэтому путь локальный -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
