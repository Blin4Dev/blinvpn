<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlinVPN</title>
    <!-- Официальный SDK Telegram Mini Apps: initData, expand(), requestFullscreen() -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #14110E; }
      #blin-boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #14110E;
      }
      #blin-boot img {
        width: min(200px, 42vh); height: min(200px, 42vh);
        max-width: 200px; max-height: 200px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="blin-boot"><img src="/assets/logo.png" alt="" width="200" height="200" /></div>
    <!-- Vite root теперь src/app, поэтому путь локальный -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
