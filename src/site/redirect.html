<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BlinVPN — открываем приложение…</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #111; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .card { max-width: 360px; width: 100%; }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
    p { color: #b8b8b8; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
    .brand { color: #F18726; }
    .btn {
      display: inline-block; width: 100%; box-sizing: border-box;
      background: #F18726; color: #fff; text-decoration: none;
      font-size: 17px; font-weight: 600; padding: 15px 0; border-radius: 16px;
    }
    .sp {
      width: 44px; height: 44px; margin: 0 auto 22px; border-radius: 50%;
      border: 4px solid rgba(241,135,38,.25); border-top-color: #F18726;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="sp" id="sp"></div>
    <h1>Blin<span class="brand">VPN</span></h1>
    <p>Открываем приложение с вашей подпиской… Если ничего не произошло — нажмите кнопку ниже.</p>
    <a class="btn" id="go" href="#" rel="noopener">Перейти</a>
  </div>
  <script>
    (function () {
      // Ссылка вида incy://... или happ://... передаётся в ?url= (URL-encoded).
      var raw = new URLSearchParams(location.search).get('url') || '';
      var target = '';
      try { target = decodeURIComponent(raw); } catch (e) { target = raw; }

      var go = document.getElementById('go');
      // Разрешаем только кастомные схемы приложений — защита от open-redirect.
      if (/^(incy|happ):\/\//i.test(target)) {
        go.setAttribute('href', target);
        // Пытаемся открыть сразу; кнопка остаётся как запасной вариант.
        try { window.location.href = target; } catch (e) {}
        setTimeout(function () {
          var sp = document.getElementById('sp');
          if (sp) sp.style.display = 'none';
        }, 1200);
      } else {
        var sp = document.getElementById('sp');
        if (sp) sp.style.display = 'none';
        go.style.display = 'none';
        document.querySelector('p').textContent = 'Ссылка недействительна.';
      }
    })();
  </script>
</body>
</html>
