# blinvpn 2.0: оркестрация сервисов
# api/webhook/bot в network_mode host (remnawave :3000, nginx на 127.0.0.1)
# miniapp/panel: spa на 127.0.0.1:{9741,9742}

# ротация docker-логов: 50мб × 3 файла
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-python-build: &python-build
  build:
    context: .
    dockerfile: docker/Dockerfile.python
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  env_file: .env
  environment:
    DB_PATH: /app/data/data.db
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  network_mode: host
  logging: *default-logging

services:
  api:
    <<: *python-build
    container_name: blinvpn-api
    command: >
      uvicorn core:app --host 127.0.0.1 --port ${API_PORT:-8000}
      --forwarded-allow-ips 127.0.0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.getenv('API_PORT','8000'), timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  webhook:
    <<: *python-build
    container_name: blinvpn-webhook
    command: >
      uvicorn webhook:app --host 127.0.0.1 --port ${WEBHOOK_PORT:-5000}
      --forwarded-allow-ips 127.0.0.1
    depends_on:
      - api

  bot:
    <<: *python-build
    container_name: blinvpn-bot
    command: python /app/src/bot/bot.py
    depends_on:
      - api

  # мониторинг серверов (blinmon, ping, vless, инциденты)
  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: blinvpn-monitor
    env_file: .env
    environment:
      DB_PATH: /app/data/data.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    depends_on:
      - api

  miniapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.miniapp
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: blinvpn-miniapp
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${MINIAPP_PORT:-9741}:80"
    # живой mount assets/ (ro)
    volumes:
      - ./assets:/usr/share/nginx/live/assets:ro

  panel:
    build:
      context: .
      dockerfile: docker/Dockerfile.panel
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: blinvpn-panel
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${PANEL_PORT:-9742}:80"
    # живой mount assets/ (ro)
    volumes:
      - ./assets:/usr/share/nginx/live/assets:ro

  # xbm: балансировщик подписки (см. xbm/NOTICE.md); ставится из панели
  # сеть remnawave; конфиг ./data/xbm/panel.json (на лету)
  xbm:
    build:
      context: ./xbm
    container_name: blinvpn-xbm
    profiles: ["xbm"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      REMNAWAVE_URL: ${XBM_REMNAWAVE_URL:-http://remnawave:3000}
      SUB_PAGE_URL: ""
      SUB_DOMAIN: ${XBM_SUB_DOMAIN:-}
      CONFIG_PATH: /app/config.json
      PANEL_CONFIG_PATH: /app/state/panel.json
    volumes:
      - ./xbm/config.json:/app/config.json:ro
      - ./data/xbm:/app/state:ro
    ports:
      - "127.0.0.1:${XBM_PORT:-4100}:4100"
    networks:
      - remnawave

networks:
  remnawave:
    external: true
    name: ${XBM_DOCKER_NETWORK:-remnawave-network}
