server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Установщик агента мониторинга — отдаём как текст, без кеша
    location = /node.sh {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        try_files /node.sh =404;
    }

    # SPA-роутинг: /payment/waiting и др. клиентские пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /assets/*: сначала живой каталог assets/ с сервера (смонтирован в
    # docker-compose) — заменённый логотип виден сразу, без пересборки.
    # Если файла там нет — берём из сборки (там же лежат js/css бандлы).
    location ^~ /assets/ {
        root /usr/share/nginx/live;
        add_header Cache-Control "public, max-age=600";
        try_files $uri @built_assets;
    }
    location @built_assets {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
