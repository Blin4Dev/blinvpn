# кеш для /assets/: файлы сборки с хешем в имени (index-AbC123xy.js) не меняются — год;
# остальное (logo.png и т.п., можно заменить без пересборки) — неделя
map $uri $blin_assets_cache {
    "~-[A-Za-z0-9_-]{8}\.(js|css|woff2|png|svg|webp)$" "public, max-age=31536000, immutable";
    default "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # сжатие: js/css/json/svg в 3–4 раза меньше.
    # gzip_http_version 1.0 — запросы приходят от nginx хоста через proxy_pass (по умолчанию HTTP/1.0),
    # без этого контейнер отдавал бы всё несжатым.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    location = /node.sh {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        try_files /node.sh =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files /sw.js =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files /manifest.webmanifest =404;
    }

    location / {
        # index.html всегда свежий: в нём ссылки на новые хешированные файлы
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/live;
        add_header Cache-Control "public, max-age=600";
        try_files $uri @built_assets;
    }
    location @built_assets {
        root /usr/share/nginx/html;
        add_header Cache-Control $blin_assets_cache;
    }

    # шрифт иконок с хешем в имени (scripts/subset-icons.py)
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp|gif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
